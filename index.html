<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert between 150+ world currencies with live exchange rates." />
    <meta name="theme-color" content="#4f46e5" />
    <title>Currency Converter</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="card__header">
        <span class="logo" aria-hidden="true"><i class="fa-solid fa-coins"></i></span>
        <div>
          <h1>Currency Converter</h1>
          <p class="subtitle">Live exchange rates for 150+ currencies</p>
        </div>
      </header>

      <form id="converter" novalidate>
        <div class="field">
          <label for="amount">Amount</label>
          <div class="amount-box">
            <input
              id="amount"
              name="amount"
              type="number"
              inputmode="decimal"
              min="0"
              step="any"
              value="100"
              aria-describedby="amount-error"
              required
            />
            <span class="amount-code" id="amount-code" aria-hidden="true">USD</span>
          </div>
          <p class="field-error" id="amount-error"></p>
        </div>

        <div class="currencies">
          <div class="field">
            <label for="from">From</label>
            <div class="select-box">
              <img id="from-flag" src="https://flagcdn.com/w40/us.png" alt="" width="28" height="20" />
              <select id="from" name="from"></select>
              <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </div>
          </div>

          <button type="button" class="swap" id="swap" aria-label="Swap currencies" title="Swap currencies">
            <i class="fa-solid fa-right-left" aria-hidden="true"></i>
          </button>

          <div class="field">
            <label for="to">To</label>
            <div class="select-box">
              <img id="to-flag" src="https://flagcdn.com/w40/pk.png" alt="" width="28" height="20" />
              <select id="to" name="to"></select>
              <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
            </div>
          </div>
        </div>

        <section class="result" id="result" aria-live="polite" aria-busy="true">
          <p class="result__from" id="result-from">&nbsp;</p>
          <p class="result__value" id="result-value">Loading rates…</p>
          <p class="result__rate" id="result-rate">&nbsp;</p>
          <div class="result__error" id="result-error" hidden>
            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
            <span>Couldn't load exchange rates. Check your connection.</span>
            <button type="button" class="link-button" id="retry">Try again</button>
          </div>
        </section>

        <button type="submit" class="btn">
          <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
          Refresh rate
        </button>
      </form>

      <section class="popular" aria-labelledby="popular-title">
        <h2 class="popular__title" id="popular-title">Popular conversions</h2>
        <ul class="chips">
          <li><button type="button" class="chip" data-from="USD" data-to="PKR">USD → PKR</button></li>
          <li><button type="button" class="chip" data-from="EUR" data-to="USD">EUR → USD</button></li>
          <li><button type="button" class="chip" data-from="GBP" data-to="PKR">GBP → PKR</button></li>
          <li><button type="button" class="chip" data-from="AED" data-to="PKR">AED → PKR</button></li>
          <li><button type="button" class="chip" data-from="SAR" data-to="PKR">SAR → PKR</button></li>
        </ul>
      </section>

      <footer class="card__footer">
        <p id="updated">Rates from the free Currency API</p>
      </footer>
    </main>

    <script src="currencies.js"></script>
    <script src="app.js"></script>
  </body>
</html>
